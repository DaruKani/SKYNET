name: SKYNET validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
      - name: Build Debug
        run: msbuild Skynet.sln /t:Build /p:Configuration=Debug /p:Platform="Any CPU"
      - name: Build Release
        run: msbuild Skynet.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU"
      - name: Validate learning tools
        run: python Tools/Skynet/test_learning.py
      - name: Validate bounded research inspector
        run: python Tools/Skynet/test_ygo_agent_inspection.py
      - name: Validate public-observation shadow mapping
        run: python Tools/Skynet/test_ygo_agent_shadow.py
      - name: Validate card-selection demonstration audits
        run: python Tools/Skynet/test_demonstrations.py
      - name: Validate owned Arena process cleanup
        run: python Tools/Skynet/test_arena_process_owner.py
      - name: Stage explicit product payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path Artifacts/package/Data -Force | Out-Null
          ./Tools/Skynet/Install-MDPro4.ps1 -GameRoot Artifacts/package -Configuration Release
      - uses: actions/upload-artifact@v6
        with:
          name: SKYNET-windows
          path: Artifacts/package/Data/Skynet/
          if-no-files-found: error
  arena:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: Arena
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Arena/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
  mono:
    runs-on: ubuntu-latest
    container:
      image: mono:6.8.0.123
    steps:
      - uses: actions/checkout@v6
      - name: Build with legacy Mono
        run: msbuild Skynet.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU"
